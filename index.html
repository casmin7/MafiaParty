<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="A digital assistant for Mafia game moderators. Easily assign custom roles, calculate complex night phase actions, and keep your game moving smoothly.">
	<title>MafiaParty</title>
	<link rel="stylesheet" href="style.css">
	<!-- Dynamic SVG for modern browsers (switches themes using internal CSS) -->
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />

  <!-- PNG Fallbacks for light and dark themes -->
  <link rel="icon" type="image/png" href="/favicon/favicon-light-96x96.png" sizes="96x96" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" href="/favicon/favicon-dark-96x96.png" sizes="96x96" media="(prefers-color-scheme: dark)" />

  <!-- Legacy fallback for older browsers and web crawlers -->
  <link rel="icon" href="/favicon/favicon.ico" sizes="any" />

  <!-- Apple & PWA metadata -->
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Mafia" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
  <!-- Automatically changes the PWA title bar color based on OS mode -->
  <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)" />
</head>
<body>
    <header id="game_header">
      <div class="header-left">
        <div class="title-row">
          <h1 id="stageTitle">SETUP PHASE</h1>
          <span id="phaseBadge" class="phase-badge">SETUP</span>
        </div>
        <p id="roleSubTitle">Add players to get started</p>
      </div>

      <div class="header-right">
        <div class="player-count-badge">
          Alive: <span id="aliveCount">0</span> / <span id="totalCount">0</span>
        </div>
      </div>
    </header>
    <main>
        <ul id="playerList">
        </ul>
    </main>


    <div id="setup_div">
        <div class="setup-grid">
          <!-- Column 1: Active Roles -->
          <div class="setup-column">
            <h3>Extra Roles</h3>
            <label class="m3-switch-label">
              <span>Detective</span>
              <input type="checkbox" id="detectiveCheckbox" class="m3-switch" onchange="saveCheckboxState()">
              <span class="m3-switch-track"><span class="m3-switch-thumb"></span></span>
            </label>

            <label class="m3-switch-label">
              <span>Doctor</span>
              <input type="checkbox" id="doctorCheckbox" class="m3-switch" onchange="saveCheckboxState()">
              <span class="m3-switch-track"><span class="m3-switch-thumb"></span></span>
            </label>

            <label class="m3-switch-label">
              <span>Escort</span>
              <input type="checkbox" id="escortCheckbox" class="m3-switch" onchange="saveCheckboxState()">
              <span class="m3-switch-track"><span class="m3-switch-thumb"></span></span>
            </label>

            <label class="m3-switch-label">
              <span>Cupid</span>
              <input type="checkbox" id="cupidCheckbox" class="m3-switch" onchange="saveCheckboxState()">
              <span class="m3-switch-track"><span class="m3-switch-thumb"></span></span>
            </label>

            <label class="m3-switch-label">
              <span>Mutilator</span>
              <input type="checkbox" id="mutilatorCheckbox" class="m3-switch" onchange="saveCheckboxState()">
              <span class="m3-switch-track"><span class="m3-switch-thumb"></span></span>
            </label>
          </div>

          <!-- Column 2: Optional Settings -->
          <div class="setup-column">
            <h3>Optional Settings</h3>

            <label class="m3-switch-label">
                <div class="switch-label-group">
                  <span class="label-title">Skip Eliminated Roles</span>
                  <span class="label-subtext">Skips eliminated roles during night phase</span>
                </div>
              <input type="checkbox" id="autoAdvanceCheckbox" class="m3-switch" checked onchange="saveCheckboxState()">
              <span class="m3-switch-track"><span class="m3-switch-thumb"></span></span>
            </label>

            <label class="m3-switch-label">
              <div class="switch-label-group">
                <span class="label-title">Auto-Reset on Win</span>
                <span class="label-subtext">Automatically reset the game as soon as Mafia or Town wins</span>
              </div>
              <input type="checkbox" id="resetWinCheckbox" class="m3-switch" checked onchange="saveCheckboxState()">
              <span class="m3-switch-track"><span class="m3-switch-thumb"></span></span>
            </label>

            <label class="m3-switch-label">
              <div class="switch-label-group">
                <span class="label-title">Bloody Finish</span>
                <span class="label-subtext">Escort dies if she visits the killer</span>
              </div>
              <input type="checkbox" id="escortDiesCheckbox" class="m3-switch" onchange="saveCheckboxState()">
              <span class="m3-switch-track"><span class="m3-switch-thumb"></span></span>
            </label>
          </div>
        </div>
    </div>
<!--https://www.svgrepo.com/collection/generica-tiny-interface-icons/6-->
<nav id="bottom_controls" aria-label="Game Controls">
  <!-- SETUP STAGE BUTTONS -->
  <button id="btn_delete_all" aria-label="Delete all players" onclick="deleteAllPlayer()">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <path d="M3 6.98996C8.81444 4.87965 15.1856 4.87965 21 6.98996" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8.00977 5.71997C8.00977 4.6591 8.43119 3.64175 9.18134 2.8916C9.93148 2.14146 10.9489 1.71997 12.0098 1.71997C13.0706 1.71997 14.0881 2.14146 14.8382 2.8916C15.5883 3.64175 16.0098 4.6591 16.0098 5.71997" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 13V18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19 9.98999L18.33 17.99C18.2225 19.071 17.7225 20.0751 16.9246 20.8123C16.1266 21.5494 15.0861 21.9684 14 21.99H10C8.91389 21.9684 7.87336 21.5494 7.07541 20.8123C6.27745 20.0751 5.77745 19.071 5.67001 17.99L5 9.98999" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <button id="btn_add_player" type="button" onclick="addPlayer()">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <path d="M12.1992 12C14.9606 12 17.1992 9.76142 17.1992 7C17.1992 4.23858 14.9606 2 12.1992 2C9.43779 2 7.19922 4.23858 7.19922 7C7.19922 9.76142 9.43779 12 12.1992 12Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3 22C3.57038 20.0332 4.74795 18.2971 6.36438 17.0399C7.98081 15.7827 9.95335 15.0687 12 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19 22V14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 18H23" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Add Player
  </button>

  <!-- GAMEPLAY STAGE BUTTONS -->
  <button id="btn_prev_stage" aria-label="Previous Stage" onclick="previousStage()">
    <svg viewBox="-0.5 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <path d="M20.0195 3.51001C22.5695 4.39001 23.0195 9.09992 23.0195 12.4099C23.0195 15.7199 22.5895 20.4099 20.0195 21.3199C17.3095 22.2499 9.01953 16.1599 9.01953 12.4099C9.01953 8.65991 17.3095 2.58001 20.0195 3.51001Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1 5.92004C1 4.53933 2.11929 3.42004 3.5 3.42004C4.88071 3.42004 6 4.53933 6 5.92004V18.92C6 20.3008 4.88071 21.42 3.5 21.42C2.11929 21.42 1 20.3008 1 18.92V5.92004Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- DAY PHASE ONLY: RESET GAME -->
  <button id="btn_reset_game" type="button" onclick="resetGame()" aria-label="Reset Game Button">
      <svg viewBox="-0.5 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 8.91992V14.4199C4 16.0112 4.63211 17.5374 5.75732 18.6626C6.88254 19.7878 8.4087 20.4199 10 20.4199H20.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1 11.9199L4 8.91992L7 11.9199" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 15.9199V10.4199C20 8.82862 19.3678 7.30246 18.2426 6.17725C17.1174 5.05203 15.5913 4.41992 14 4.41992H3.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M23 12.9199L20 15.9199L17 12.9199" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
  </button>

  <!-- NIGHT PHASE ONLY: EDIT ROLES -->
  <button id="btn_edit_toggle" type="button" onclick="editToggle()">
    <span id="edit_status_text">Lock Roles</span>
  </button>

  <button id="btn_show_log" type="button" onclick="showLog()">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 3.98999H8C6.93913 3.98999 5.92178 4.41135 5.17163 5.1615C4.42149 5.91164 4 6.92912 4 7.98999V17.99C4 19.0509 4.42149 20.0682 5.17163 20.8184C5.92178 21.5685 6.93913 21.99 8 21.99H16C17.0609 21.99 18.0783 21.5685 18.8284 20.8184C19.5786 20.0682 20 19.0509 20 17.99V7.98999C20 6.92912 19.5786 5.91164 18.8284 5.1615C18.0783 4.41135 17.0609 3.98999 16 3.98999Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 2V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 2V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 16H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 12H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Show Log
  </button>

  <!-- ALWAYS VISIBLE ADVANCE BUTTON -->
  <button id="btn_next_stage" aria-label="Advance Game" onclick="nextStage()">
    <svg viewBox="-0.5 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <path d="M3.98047 3.51001C1.43047 4.39001 0.980469 9.09992 0.980469 12.4099C0.980469 15.7199 1.41047 20.4099 3.98047 21.3199C6.69047 22.2499 14.9805 16.1599 14.9805 12.4099C14.9805 8.65991 6.69047 2.58001 3.98047 3.51001Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M23 5.92004C23 4.53933 21.8807 3.42004 20.5 3.42004C19.1193 3.42004 18 4.53933 18 5.92004V18.92C18 20.3008 19.1193 21.42 20.5 21.42C21.8807 21.42 23 20.3008 23 18.92V5.92004Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</nav>
<script src="script.js" defer></script>
</body>
</html>
