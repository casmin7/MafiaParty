<!DOCTYPE html>
<html lang="en">

	<link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="playerList">
    </div>

<div id="setup_div">
    <button onclick="addPlayer()">Add Player</button>
    <label for="detectiveCheckbox">Detective</label>

    <label for="doctorCheckbox">Doctor</label>

    <button onclick="currentRoleIndex --">Previous Role</button>
    <button onclick="resetGame()">Reset Game State</button>

</div>
